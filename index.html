<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学ワークサポート（方程式・比例と反比例）</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#fbfdff;--grid:#e1ebf7;--ink:#1f3a6e;--text:#22303f;--muted:#5d6b7c;
  --red:#d4352c;--marker:#fff0a3;--ok:#2f8a55;--line:#c9d6e6;--chip:#eef3fa;--card:#ffffff;--gold:#c98a00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;
    --paper:#141b25;--grid:#1d2836;--ink:#9cc0ff;--text:#e4ebf3;--muted:#9aa8b8;
    --red:#ff7a6e;--marker:#5b4e14;--ok:#6fd39a;--line:#2d3b4e;--chip:#1c2532;--card:#18212d;--gold:#ffc94d;}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:17px;line-height:1.7;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 0 6px}
.top h1{font-family:"Klee One",serif;font-weight:600;color:var(--ink);font-size:clamp(24px,5.5vw,34px);margin:0;line-height:1.3}
.small{font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;cursor:pointer}
h2{font-family:"Klee One",serif;font-weight:600;color:var(--ink);font-size:25px;margin:6px 0 2px;line-height:1.4}
h3{font-size:18px;margin:0 0 6px;color:var(--ink)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 18px}
.btn{font-weight:700;background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:9px 18px;cursor:pointer}
.btn.sub{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.big{font-size:19px;padding:12px 22px}
.eqt{font-family:"Klee One",serif;font-size:22px;line-height:2.1;color:var(--ink)}
i{font-family:"Times New Roman",serif;font-style:italic;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.12;font-size:.82em}
.fr>.n{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>.d{padding:0 3px}

/* ホーム：ステージマップ */
.today{border:2px solid var(--ink);border-radius:8px;padding:16px;background:var(--card);margin:10px 0 22px}
.today .lbl{font-weight:700;color:var(--red)}
.today .nm{font-family:"Klee One",serif;font-size:26px;color:var(--ink);font-weight:600;margin:2px 0 10px}
.bar{height:12px;border-radius:6px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin:6px 0 4px}
.bar>span{display:block;height:100%;background:var(--ok);transition:width .4s}
.map{list-style:none;margin:0;padding:0;position:relative}
.map::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:4px;background:var(--line);border-radius:2px}
.map li{position:relative;margin:0 0 10px}
.node{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:none;padding:4px 0;cursor:pointer}
.dot{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;background:var(--card);border:3px solid var(--line);color:var(--muted);position:relative;z-index:1}
.node.clear .dot{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.node.next .dot{border-color:var(--red);color:var(--red);box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 22%,transparent)}
.node.boss .dot{border-radius:10px}
.node .txt b{display:block;color:var(--ink);font-size:18px}
.node .txt span{font-size:14px;color:var(--muted)}
.node .badge{margin-left:auto;font-size:13px;font-weight:700;padding:2px 8px;border-radius:12px}
.node.clear .badge{color:var(--ok);border:1px solid var(--ok)}
.node.next .badge{color:var(--paper);background:var(--red)}

/* ステージ画面 */
.back{background:none;border:none;color:var(--ink);font-weight:700;cursor:pointer;padding:6px 0}
.steps{display:flex;gap:0;margin:12px 0 16px;counter-reset:s}
.steps button{flex:1;border:2px solid var(--line);background:var(--chip);padding:8px 4px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.steps button:first-child{border-radius:8px 0 0 8px}.steps button:last-child{border-radius:0 8px 8px 0}
.steps button+button{border-left:none}
.steps button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps button.ok::after{content:" ✓";color:var(--ok)}
.steps button.on.ok::after{color:var(--marker)}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:620px){.ex{grid-template-columns:1fr}}
.ex>div{border-radius:4px;padding:8px 12px}
.bad{border:2px dashed var(--red)}.good{border:2px solid var(--ok)}
.tag{font-weight:700;font-size:15px}.bad .tag{color:var(--red)}.good .tag{color:var(--ok)}
.ln{display:block}.ln.x{position:relative;width:fit-content}
.ln.x::after,.qline.right::after{content:"";position:absolute;left:-4px;right:-4px;top:54%;height:3px;border-radius:2px;background:var(--red);transform:scaleX(0);transform-origin:left;animation:strike .5s .5s ease-out forwards}
@keyframes strike{to{transform:scaleX(1)}}
.ln.hi{width:fit-content;background:var(--marker);border-radius:2px;padding:0 6px;margin-left:-6px}
.note{color:var(--red);font-size:15px;margin:2px 0 0}
.rule{background:var(--marker);padding:2px 6px;border-radius:2px}
.qline{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:4px;padding:0 8px;cursor:pointer;color:var(--ink)}
.qline:hover{border-color:var(--line)}
.qline{position:relative}.qline.right{border-color:var(--red)}.qline.right::after{animation-delay:0s;left:8px;right:auto;width:calc(100% - 16px)}
.qline.nope{opacity:.45}
.fb{min-height:1.7em;font-size:15px;margin-top:6px}.fb.ok{color:var(--ok)}.fb.ng{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{min-width:44px;padding:4px 10px;border:1px solid var(--line);background:var(--chip);border-radius:4px;cursor:pointer;font-size:15px}
.chip.done{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.chip.cur{outline:2px solid var(--ink);outline-offset:1px}

/* 式をさわるエンジン */
.goal{font-size:15px;color:var(--muted);margin:0 0 4px}
.eqrow{font-family:"Klee One",serif;font-size:clamp(24px,5.5vw,32px);color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px;min-height:76px;padding:6px 4px;justify-content:center}
.it{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:0 8px;cursor:pointer;color:var(--ink);font-family:inherit;font-size:inherit;line-height:1.6;position:relative}
.it:hover{border-color:var(--ink)}
.it.grp{border-color:var(--ink);border-style:solid}
.it.stampable{border:2px dashed var(--red)}
.it.stamped{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}
.it .st{position:absolute;top:-12px;right:-8px;background:var(--red);color:#fff;font-family:"BIZ UDPGothic",sans-serif;font-size:12px;border-radius:10px;padding:0 6px;line-height:1.6}
.it.sel{border-color:var(--red);background:var(--marker)}
.it.fixed{cursor:default;border-color:transparent;background:transparent}
.eqs{padding:0 6px}
.colon{padding:0 4px}
.seesaw{display:block;margin:0 auto 4px;width:260px;max-width:70%}
.seesaw .beam{transform-origin:130px 22px}
.seesaw line,.seesaw path{stroke:var(--ink);stroke-width:3;fill:none}
.seesaw text{font-size:12px;fill:var(--muted);font-family:"BIZ UDPGothic",sans-serif}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tool{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 14px;cursor:pointer;font-weight:700;font-size:15px}
.tool.undo{border-color:var(--line);color:var(--muted);font-weight:400}
.panel{border:2px solid var(--ink);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--card)}
.panel .q{font-family:"Klee One",serif;font-size:24px;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:4px 14px;cursor:pointer;font-family:"Klee One",serif;font-size:20px}
.opt:hover{border-color:var(--ink)}
.opt[disabled]{opacity:.35;cursor:default;text-decoration:line-through}
.opt.txt{font-family:"BIZ UDPGothic",sans-serif;font-size:16px;text-align:left}
.inrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.inrow input{font-family:"Klee One",serif;font-size:22px;width:7em;padding:3px 10px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink)}
.hintline{font-size:15px;color:var(--ink);background:var(--marker);display:inline-block;padding:1px 8px;border-radius:3px}
.clearbox{text-align:center;border:3px solid var(--ok);border-radius:10px;padding:12px;margin-top:10px}
.clearbox b{font-size:22px;color:var(--ok)}
@media (prefers-reduced-motion:no-preference){
  .flip{animation:flip .45s ease-out}
  @keyframes flip{0%{transform:translateY(-14px) scale(.8);opacity:.3}60%{transform:translateY(3px)}100%{transform:none;opacity:1}}
  .pop{animation:pop .3s ease-out}
  @keyframes pop{from{transform:scale(.9)}to{transform:none}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
}

/* 文章題 */
.story{margin:0 0 8px}
.dg{width:100%;max-width:600px;height:auto;display:block;margin:4px auto}
.dg text{font-family:"BIZ UDPGothic",sans-serif;font-size:15px;fill:var(--text)}
.dg .k{fill:var(--ink);font-weight:700}.dg .r{fill:var(--red)}
.dg .bx{fill:none;stroke:var(--ink);stroke-width:2}
.dg .bxf{fill:var(--marker);stroke:var(--ink);stroke-width:2}
.dg .ds{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:6 4}
.dg .ln2{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.dg .ar{stroke:var(--ink);stroke-width:2;fill:none}
.dg .slot rect{fill:var(--card);stroke:var(--red);stroke-width:2;stroke-dasharray:5 4;cursor:pointer}
.dg .slot text{fill:var(--red);font-weight:700;cursor:pointer}
.dg .slot.sel rect{fill:var(--marker);stroke-dasharray:none}
.dg .slot.filled rect{stroke:var(--ok);stroke-dasharray:none;fill:color-mix(in srgb,var(--ok) 12%,var(--card))}
.dg .slot.filled text{fill:var(--ok)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pc{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:2px 14px;cursor:pointer;font-family:"Klee One",serif;font-size:19px;color:var(--ink)}
.pc.sel{background:var(--ink);color:var(--paper)}
.pc.used{opacity:.3;cursor:default}
.builder{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;font-family:"Klee One",serif;font-size:22px;color:var(--ink)}
.box{min-width:120px;min-height:48px;border:2px dashed var(--red);border-radius:8px;display:grid;place-items:center;padding:2px 10px;cursor:pointer;background:var(--card)}
.box.f{border-style:solid;border-color:var(--ink)}
.wsteps{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;margin:0 0 8px}
.wsteps span{padding:1px 8px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.wsteps span.on{border-color:var(--red);color:var(--red);font-weight:700}
.wsteps span.ok{border-color:var(--ok);color:var(--ok)}

/* ボス */
.bosshead{display:flex;align-items:center;gap:14px;margin:0 0 10px}
.bosshead svg{width:76px;height:76px;flex:none}
.hp{flex:1}
.hpbar{display:flex;gap:3px}
.hpbar span{flex:1;height:14px;background:var(--red);border-radius:2px;transition:opacity .3s}
.hpbar span.off{opacity:.15}
.hearts{font-size:20px;letter-spacing:2px;color:var(--red)}

/* 紙 */
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--line)}
.plist input{width:22px;height:22px;margin-top:3px;accent-color:var(--ok);flex:none}
.rules{margin:0;padding-left:1.3em}

/* アニメーション */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fxtok{position:fixed;font-family:"Klee One",serif;font-weight:600;font-size:24px;color:var(--red);white-space:nowrap;will-change:transform;line-height:1.3}
.fxtok.chipfly{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:2px 14px;color:var(--ink);font-size:19px}
.fxtok.stampk{font-size:34px;border:3px solid var(--red);border-radius:8px;padding:0 8px;background:color-mix(in srgb,var(--card) 75%,transparent)}
.fxtok.divk{background:var(--marker);border-radius:6px;padding:0 8px;color:var(--ink)}
.fxp{position:fixed;will-change:transform}
.dotp{width:9px;height:9px;border-radius:50%}
.ringp{width:44px;height:44px;border-radius:50%;border:3px solid}
.conf{width:9px;height:14px;border-radius:2px}
.chunk{width:12px;height:12px;border-radius:2px}
.banner{position:fixed;z-index:41;font-family:"Klee One",serif;font-weight:600;font-size:clamp(36px,9vw,64px);white-space:nowrap;text-shadow:0 3px 0 var(--card),0 -3px 0 var(--card),3px 0 0 var(--card),-3px 0 0 var(--card),0 6px 14px rgba(0,0,0,.25);pointer-events:none}
.eqwrap{position:relative}
.eqwrap.prop{padding:46px 0 42px}
.arcs{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.arcs path{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}
.arcs text{fill:var(--red);font-size:13px;font-weight:700;font-family:"BIZ UDPGothic",sans-serif}
.sg{display:inline-block}
.gin{border-radius:4px;padding:0 1px}
.gin.done{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.map{padding-left:48px}
.map::before{left:71px}
.runner{position:absolute;left:0;top:0;width:40px;height:46px;z-index:2;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .runner svg{animation:bob 1.4s ease-in-out infinite}
  .boss-idle{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .node.next .dot{animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 10%,transparent)}}
}
@media (prefers-reduced-motion:reduce){.ln.x::after,.qline.right::after{animation:none;transform:none}}

/* 4章の部品 */
.big{font-size:19px;margin:6px 0}
.gwrap{display:flex;justify-content:center}
.grid{width:100%;max-width:420px;height:auto;touch-action:manipulation}
.grid .gl{stroke:var(--line);stroke-width:1}
.grid .ax{stroke:var(--ink);stroke-width:2}
.grid .gt{font-size:13px;fill:var(--muted);font-family:"BIZ UDPGothic",sans-serif}
.grid .gt.it{font-style:italic;font-family:"Times New Roman",serif;font-size:16px;fill:var(--ink)}
.grid .lp{fill:transparent;cursor:pointer}
.grid .lp:hover{fill:var(--marker);opacity:.8}
.grid .pt circle{fill:var(--ink)}
.grid .pt.ok circle{fill:var(--ok)}
.grid .pt.cur circle{fill:var(--red)}
.grid .pt text{font-size:15px;font-weight:700;fill:var(--ink);font-family:"BIZ UDPGothic",sans-serif}
.grid .walk{fill:none;stroke:var(--red);stroke-width:3;stroke-linejoin:round;stroke-dasharray:6 4}
.grid .gline{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}
.grid .hyp{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}
.nline{width:100%;max-width:600px;height:auto;display:block;margin:4px auto}
.nline .nl,.nline .tk{stroke:var(--ink);stroke-width:2}
.nline .tl{font-size:14px;fill:var(--text);font-family:"BIZ UDPGothic",sans-serif}.nline .tl.b{font-weight:700;fill:var(--red)}
.nline .shade{stroke:var(--red);stroke-width:7;stroke-linecap:round;opacity:.75;fill:none}
.nline .mk{cursor:pointer}
.nline .mk circle{stroke:var(--ink);stroke-width:3;fill:var(--card)}
.nline .mk.unset circle{stroke:var(--red);stroke-dasharray:4 3}
.nline .mk.in circle{fill:var(--ink)}
.opt.on{border-color:var(--red);background:var(--marker)}
.ineq,.tmpl{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:"Klee One",serif;font-size:28px;color:var(--ink);margin:10px 0}
.ops{min-width:52px;min-height:48px;border:2px dashed var(--red);border-radius:8px;background:var(--card);color:var(--red);font-family:"Klee One",serif;font-size:26px;cursor:pointer}
.ops.wide{min-width:80px}
.ops.f{border-style:solid;border-color:var(--ink);color:var(--ink)}
.eqbig{font-family:"Klee One",serif;font-size:32px;color:var(--ok);text-align:center;margin:8px 0;font-weight:600}
.inrow input.sm{width:3.6em}
.mach{display:grid;grid-template-columns:1fr 1.6fr 1fr;align-items:center;gap:8px;margin:10px 0;text-align:center}
.mio{border:2px dashed var(--ink);border-radius:10px;padding:10px 4px;font-family:"Times New Roman",serif;font-style:italic;font-size:26px;color:var(--ink)}
.mio small{display:block;font-family:"BIZ UDPGothic",sans-serif;font-style:normal;font-size:12px;color:var(--muted)}
.mbody{background:var(--ink);color:var(--paper);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gear{width:46px;height:46px}.gear path{fill:var(--marker)}
.mlog .lg{font-family:"Klee One",serif;font-size:20px;color:var(--ink)}.mlog .lg.many{color:var(--red)}
.tblw{overflow-x:auto;margin:8px 0 22px;padding:16px 0}
.vt{border-collapse:collapse;margin:0 auto;font-family:"Klee One",serif;font-size:20px;color:var(--ink)}
.vt th,.vt td{border:1px solid var(--line);padding:4px 10px;text-align:center;min-width:52px;background:var(--card)}
.vt th{background:var(--chip);font-family:"BIZ UDPGothic",sans-serif;font-size:15px}
.vt td.okc{color:var(--ok);font-weight:600}
.vt input.cell{width:3.6em;font-family:"Klee One",serif;font-size:18px;border:2px solid var(--ink);border-radius:4px;padding:1px 4px;background:var(--card);color:var(--ink)}
.fxtok.tagk{font-size:18px;background:var(--marker);border-radius:10px;padding:0 8px;color:var(--ink)}
.tag2{display:inline-block;font-weight:700;color:var(--paper);background:var(--ok);border-radius:14px;padding:2px 14px;margin:0}
.opt.big2{font-size:22px;padding:10px 26px;font-family:"BIZ UDPGothic",sans-serif;font-weight:700}

/* 1つにまとめた版・苦手つぶし */
.weakcard{border:2px solid var(--red);border-radius:10px;background:var(--card);padding:12px 14px;margin:6px 0 18px}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.wkhead h3{margin:0;color:var(--red)}
.wkrow{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dotted var(--line)}
@media (max-width:560px){.wkrow{grid-template-columns:1fr auto}.wkblocks{grid-column:1/-1;order:3}}
.wkname b{display:block;font-size:15px;color:var(--ink)}.wkname span{font-size:12px}
.wkblocks{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.blk{width:30px;height:30px}.blk.big{width:62px;height:62px}

<body>
<div class="wrap" id="app"></div>

<script>
/* ===== 保存 ===== */
const KEY='math-work-support-v1';
let S={st:{},sound:true,miss:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const stS=id=>(S.st[id]=S.st[id]||{point:false,done:{},paper:{}});

/* ===== 音 ===== */
let AC=null;
function ac(){if(!S.sound)return null;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC;}catch(e){return null;}}
function tone(seq){const a=ac();if(!a)return;let t=a.currentTime;
  seq.forEach(([f,d,type,f2])=>{const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d);t+=d*.8;});}
function noise(d,hp,vol){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length)**2;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination);s.start();}
const fx={
  ok:()=>tone([[880,.1],[1320,.18]]),
  ng:()=>tone([[150,.25,'square']]),
  swoosh:()=>tone([[300,.18,'sine',1400]]),
  bang:()=>{noise(.18,800,.6);tone([[90,.12,'square',40]]);},
  stamp:()=>{noise(.08,200,.5);tone([[120,.15,'sine',60]]);},
  clear:()=>tone([[660,.1],[880,.1],[1100,.1],[1320,.35]]),
  hit:()=>{noise(.3,300,.8);tone([[200,.3,'sawtooth',50]]);},
  win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.2],[784,.12],[1047,.5]])
};

/* ===== アニメーション ===== */
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const fxl=document.createElement('div');fxl.id='fx';fxl.setAttribute('aria-hidden','true');document.body.appendChild(fxl);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ctr=r=>({x:r.left+r.width/2,y:r.top+r.height/2});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const C0='translate(-50%,-50%)';
function fxel(html,cls,x,y){const d=document.createElement('div');d.className=cls;d.innerHTML=html;d.style.left=x+'px';d.style.top=y+'px';fxl.appendChild(d);return d;}
// 項や数が弧をえがいて飛ぶ
function shot(fromR,toR,html,cls='fxtok',dur=320){
  if(RM||!fromR||!toR)return Promise.resolve();
  const a=ctr(fromR),b=ctr(toR),dx=b.x-a.x,dy=b.y-a.y,d=fxel(html,cls,a.x,a.y);
  return d.animate([{transform:`${C0} scale(1)`},{transform:`${C0} translate(${dx/2}px,${dy/2-50}px) scale(1.25)`},{transform:`${C0} translate(${dx}px,${dy}px) scale(.9)`}],
    {duration:dur,easing:'ease-in'}).finished.then(()=>d.remove());
}
// はじける粒
function burst(x,y,color,n=10,dist=46){
  if(RM)return;color=color||cv('--red');
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.4,r=dist*(.7+Math.random()*.6);
    const d=fxel('','fxp dotp',x,y);d.style.background=color;
    d.animate([{transform:`${C0} scale(1)`,opacity:1},{transform:`${C0} translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`,opacity:0}],{duration:480,easing:'ease-out'}).finished.then(()=>d.remove());}
  const ring=fxel('','fxp ringp',x,y);ring.style.borderColor=color;
  ring.animate([{transform:`${C0} scale(.2)`,opacity:.9},{transform:`${C0} scale(1.6)`,opacity:0}],{duration:450,easing:'ease-out'}).finished.then(()=>ring.remove());
}
// 文字がふわっと上がって消える
function floatText(x,y,text,color){
  if(RM)return;const d=fxel(text,'fxtok',x,y);d.style.color=color||cv('--red');d.style.fontSize='28px';
  d.animate([{transform:`${C0} scale(.6)`,opacity:0},{transform:`${C0} translate(0,-20px) scale(1.2)`,opacity:1,offset:.25},{transform:`${C0} translate(0,-60px)`,opacity:0}],{duration:1000,easing:'ease-out'}).finished.then(()=>d.remove());
}
// 紙ふぶき
function confetti(n=70){
  if(RM)return;const cols=[cv('--red'),cv('--ok'),cv('--ink'),cv('--gold'),'#5aa9e6'];const W=innerWidth,H=innerHeight;
  for(let i=0;i<n;i++){const d=fxel('','fxp conf',Math.random()*W,-20);d.style.background=cols[i%cols.length];
    const dx=(Math.random()-.5)*160,rot=(Math.random()*720-360),dur=1400+Math.random()*1200;
    d.animate([{transform:`translate(0,0) rotate(0deg)`},{transform:`translate(${dx}px,${H+40}px) rotate(${rot}deg)`}],{duration:dur,delay:Math.random()*300,easing:'cubic-bezier(.25,.6,.5,1)',fill:'backwards'}).finished.then(()=>d.remove());}
}
// ぶるっとふるえる
function shake(el){if(RM||!el)return;el.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}],{duration:420});}
// 大きな文字のバナー
function banner(text,color){
  const d=fxel(text,'banner',innerWidth/2,innerHeight*.4);d.style.color=color||cv('--red');
  if(RM){setTimeout(()=>d.remove(),1500);return;}
  d.animate([{transform:`${C0} scale(.2) rotate(-12deg)`,opacity:0},{transform:`${C0} scale(1.15) rotate(3deg)`,opacity:1,offset:.25},{transform:`${C0} scale(1) rotate(0)`,opacity:1,offset:.4},{transform:`${C0} scale(1)`,opacity:1,offset:.8},{transform:`${C0} translate(0,-30px) scale(.9)`,opacity:0}],{duration:2200,easing:'ease-out'}).finished.then(()=>d.remove());
}
// ボスがバラバラにくだける
function explode(el){
  if(RM||!el)return;const r=el.getBoundingClientRect(),c=ctr(r);const cols=[cv('--ink'),cv('--red')];
  for(let i=0;i<24;i++){const d=fxel('','fxp chunk',c.x+(Math.random()-.5)*r.width*.8,c.y+(Math.random()-.5)*r.height*.8);d.style.background=cols[i%2];
    const a=Math.random()*Math.PI*2,dist=80+Math.random()*120;
    d.animate([{transform:`${C0}`,opacity:1},{transform:`${C0} translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist+60}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:900,easing:'cubic-bezier(.2,.7,.4,1)'}).finished.then(()=>d.remove());}
  el.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.4)'}],{duration:300,fill:'forwards'});
}
// ×の数のスタンプが落ちてくる
function stampDrop(el,label){
  if(RM||!el)return Promise.resolve();const c=ctr(el.getBoundingClientRect());const d=fxel(label,'fxtok stampk',c.x,c.y-6);
  const a=d.animate([{transform:`${C0} translate(0,-50px) scale(2.6) rotate(-20deg)`,opacity:0},{transform:`${C0} scale(1) rotate(-8deg)`,opacity:1}],{duration:230,easing:'ease-in'});
  return a.finished.then(()=>{burst(c.x,c.y,cv('--red'),8,34);d.animate([{opacity:1},{opacity:0,transform:`${C0} scale(1.2) rotate(-8deg)`}],{duration:260}).finished.then(()=>d.remove());});
}
// 図が線から順にかかれていく
function drawIn(svg){
  if(RM||!svg)return;let k=0;
  svg.querySelectorAll(':scope > rect, :scope > line').forEach(e=>{e.style.transformBox='fill-box';e.style.transformOrigin='left center';
    e.animate([{transform:'scaleX(0)',opacity:.3},{transform:'scaleX(1)',opacity:1}],{duration:420,delay:k++*70,easing:'ease-out',fill:'backwards'});});
  svg.querySelectorAll(':scope > text').forEach(e=>e.animate([{opacity:0},{opacity:1}],{duration:300,delay:k*70+100,fill:'backwards'}));
  svg.querySelectorAll('.slot').forEach((g,i)=>{g.style.transformBox='fill-box';g.style.transformOrigin='center';
    g.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:380,delay:k*70+250+i*130,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'backwards'});});
}
const RUNNER=`<svg viewBox="0 0 40 46" width="40" height="46"><path d="M12 9 L20 0 L28 9 Z" fill="var(--red)"/><rect x="6" y="8" width="28" height="28" rx="8" fill="var(--ink)"/><circle cx="15" cy="20" r="4" fill="var(--paper)"/><circle cx="25" cy="20" r="4" fill="var(--paper)"/><circle cx="16" cy="21" r="2" fill="var(--ink)"/><circle cx="26" cy="21" r="2" fill="var(--ink)"/><path d="M15 28 Q20 32 25 28" stroke="var(--paper)" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="10" y="36" width="6" height="8" rx="3" fill="var(--ink)"/><rect x="24" y="36" width="6" height="8" rx="3" fill="var(--ink)"/></svg>`;

/* ===== 分数 ===== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
function F(n,d=1){if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return{n:n/g,d:d/g};}
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d),fmul=(a,b)=>F(a.n*b.n,a.d*b.d),fdiv=(a,b)=>F(a.n*b.d,a.d*b.n),fneg=a=>F(-a.n,a.d);
const fint=a=>a.d===1,feq=(a,b)=>a.n===b.n&&a.d===b.d,fone=a=>a.n===1&&a.d===1;
const decable=d=>{while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;};
function parseF(s){s=String(s).normalize('NFKC').replace(/[−ー－‐―]/g,'-').replace(/\s/g,'');
  let m=s.match(/^(-?)(\d+)\/(\d+)$/);if(m&&+m[3])return F((m[1]?-1:1)*m[2],+m[3]);
  m=s.match(/^(-?)(\d+)(?:\.(\d+))?$/);if(m){const f=m[3]||'';return F((m[1]?-1:1)*parseInt(m[2]+f),10**f.length);}
  return null;}

/* ===== 式：パーサー ===== */
let uid=0;
const TM=(c,x,dec)=>({t:'n',c,x:x?1:0,dec:!!dec,id:++uid});
const GP=(k,items,dec)=>({t:'g',k,items,dec:!!dec,id:++uid});
function parseSide(src){
  const s=src.replace(/\s/g,'').replace(/[−–]/g,'-');let i=0;const out=[];
  const rn=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?/);if(!m)return null;i+=m[0].length;return m[0];};
  const toF=str=>{if(str.includes('.')){const[a,b]=str.split('.');return F(parseInt(a+b),10**b.length);}return F(parseInt(str));};
  while(i<s.length){
    let sign=1;while(s[i]==='+'||s[i]==='-'){if(s[i]==='-')sign=-sign;i++;}
    let c=F(sign),dec=false,had=false;const ns=rn();
    if(ns){had=true;dec=ns.includes('.');c=fmul(c,toF(ns));if(s[i]==='/'&&/\d/.test(s[i+1])){i++;c=fdiv(c,F(parseInt(rn())));}}
    if(s[i]==='('){let dp=1,j=i+1;while(dp){if(s[j]==='(')dp++;if(s[j]===')')dp--;j++;}
      const inner=parseSide(s.slice(i+1,j-1));i=j;if(s[i]==='/'){i++;c=fdiv(c,F(parseInt(rn())));}
      out.push(GP(c,inner,dec));}
    else if(s[i]==='x'){i++;if(s[i]==='/'){i++;c=fdiv(c,F(parseInt(rn())));}out.push(TM(c,1,dec));}
    else{if(!had)throw new Error('parse '+src);out.push(TM(c,0,dec));}
  }
  return out;
}
const unwrap=l=>(l.length===1&&l[0].t==='g'&&fone(l[0].k))?l[0].items:l;
function lin(items){let a=F(0),b=F(0);items.forEach(t=>{if(t.t==='n'){if(t.x)a=fadd(a,t.c);else b=fadd(b,t.c);}
  else{const r=lin(t.items);a=fadd(a,fmul(t.k,r.a));b=fadd(b,fmul(t.k,r.b));}});return{a,b};}
function solve(L,R){const l=lin(L),r=lin(R);return fdiv(fadd(r.b,fneg(l.b)),fadd(l.a,fneg(r.a)));}
const fStr=f=>f.d===1?String(f.n):f.n+'/'+f.d;
function mulParts(A,B){
  const isC=l=>l.length===1&&l[0].t==='n'&&!l[0].x;
  if(isC(A)&&isC(B))return[TM(fmul(A[0].c,B[0].c),0,A[0].dec||B[0].dec)];
  let k,E;if(isC(A)){k=A[0];E=B;}else{k=B[0];E=A;}
  if(E.length===1&&E[0].t==='n')return[TM(fmul(k.c,E[0].c),E[0].x,k.dec||E[0].dec)];
  return[GP(k.c,JSON.parse(JSON.stringify(E)),k.dec)];
}

/* ===== 式：表示 ===== */
const X='<i>x</i>';
const fr=(a,b)=>`<span class="fr"><span class="n">${a}</span><span class="d">${b}</span></span>`;
function numH(c,dec){c=F(Math.abs(c.n),c.d);if(c.d===1)return String(c.n);
  if(dec&&decable(c.d))return String(+(c.n/c.d).toFixed(6));return fr(c.n,c.d);}
function termAbs(t){const c=F(Math.abs(t.c.n),t.c.d);if(!t.x)return numH(c,t.dec);
  if(fone(c))return X;if(c.d===1||(t.dec&&decable(c.d)))return numH(c,t.dec)+X;if(c.n===1)return fr(X,c.d);return fr(c.n,c.d)+X;}
const isNeg=it=>(it.t==='n'?it.c.n:it.k.n)<0;
const innerH=items=>items.map((t,j)=>(isNeg(t)?(j?' − ':'−'):(j?' + ':''))+termAbs(t)).join('');
function grpAbs(g){const k=F(Math.abs(g.k.n),g.k.d),inn=innerH(g.items);
  if(fone(k))return'('+inn+')';if(k.d===1||(g.dec&&decable(k.d)))return numH(k,g.dec)+'('+inn+')';
  if(k.n===1)return fr(inn,k.d);return fr(k.n,k.d)+'('+inn+')';}
const itemAbs=it=>it.t==='n'?termAbs(it):grpAbs(it);
function grpAbsW(g,dj=-1){const k=F(Math.abs(g.k.n),g.k.d);
  const inn=g.items.map((t,j)=>`<span class="gin ${j<dj?'done':''}" data-j="${j}">${(isNeg(t)?(j?' − ':'−'):(j?' + ':''))+termAbs(t)}</span>`).join('');
  if(fone(k))return'<span class="gk">(</span>'+inn+')';if(k.d===1||(g.dec&&decable(k.d)))return'<span class="gk">'+numH(k,g.dec)+'</span>('+inn+')';
  if(k.n===1)return fr(inn,k.d);return fr(k.n,k.d)+'('+inn+')';}
function sideH(items){if(!items.length)return'0';return items.map((t,j)=>(isNeg(t)?(j?' − ':'−'):(j?' + ':''))+itemAbs(t)).join('');}
function exprH(s){try{return exprH0(s);}catch(e){return md(s.replace(/-/g,'−'));}}
function exprH0(s){
  if(s.includes(':'))return s.split('=').map(h=>h.split(':').map(p=>{const l=parseSide(p);return(l.length===1&&l[0].t==='g'&&fone(l[0].k))?'('+innerH(l[0].items)+')':sideH(l);}).join(' : ')).join(' = ');
  return s.split('=').map(h=>sideH(parseSide(h))).join(' = ');}
// 説明文用：[a|b] を分数、x を斜体に
function md(s){let h=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(^|[^a-zA-Z])([xya])(?![a-zA-Z])/g,'$1<i>$2</i>');
  return h.replace(/\[([^\[\]|]+)\|([^\[\]|]+)\]/g,(m,a,b)=>fr(a,b));}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const cp=o=>JSON.parse(JSON.stringify(o));

/* ===== 答えの判定 ===== */
function judge(input,expect){
  const s=String(input).normalize('NFKC').replace(/[−ー－‐―]/g,'-').replace(/\s/g,'').replace(/^[xa]=/i,'');
  const t=parseF(s),e=parseF(expect);
  if(!t)return{ok:false,msg:'数で入力してね（例：-3、9/2）'};
  if(!feq(t,e))return{ok:false,msg:'ちがうよ。もう一度計算しよう。'};
  const m=s.match(/^-?(\d+)\/(\d+)$/);
  if(e.d!==1&&!m)return{ok:false,msg:'値は合っている。テストでは分数で書こう。'};
  if(m&&gcd(+m[1],+m[2])>1)return{ok:false,msg:'値は合っている。約分しよう。'};
  if(m&&+m[2]===1)return{ok:false,msg:'分母が1なら整数で書こう。'};
  return{ok:true};
}
const ansH=f=>(f.n<0?'−':'')+(f.d===1?Math.abs(f.n):fr(Math.abs(f.n),f.d));

/* ===== 共通の表示 ===== */
const fH=f=>(f.n<0?'−':'')+(f.d===1?Math.abs(f.n):fr(Math.abs(f.n),f.d));
const fHp=f=>f.n<0?'('+fH(f)+')':fH(f);
const fS=f=>f.d===1?String(f.n):f.n+'/'+f.d;
const PF=s=>parseF(String(s));
const fv=f=>f.n/f.d;
const IX='<i>x</i>',IY='<i>y</i>';
function eqHi(a){if(fone(a))return`${IY} = ${IX}`;if(a.n===-1&&a.d===1)return`${IY} = −${IX}`;
  return`${IY} = ${a.n<0?'−':''}${a.d===1?Math.abs(a.n):fr(Math.abs(a.n),a.d)}${IX}`;}
const eqHan=a=>`${IY} = ${a.n<0?'−':''}${fr(Math.abs(a.n),IX)}`;
function animNew(root){
  if(RM)return;
  root.querySelectorAll('[data-new]').forEach(e=>{const dl=+(e.dataset.delay||0);
    if(e.tagName==='path'||e.tagName==='line'){const L=e.getTotalLength?e.getTotalLength():300;e.style.strokeDasharray=L+' '+L;
      e.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:+(e.dataset.dur||800),delay:dl,easing:'ease-out',fill:'backwards'}).finished.then(()=>{e.style.strokeDasharray='';});}
    else{e.style.transformBox='fill-box';e.style.transformOrigin='center';
      e.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1.7)',opacity:1,offset:.55},{transform:'scale(1)'}],{duration:480,delay:dl,easing:'ease-out',fill:'backwards'});}});
}
function clearHTML(t){return`<div class="clearbox pop"><b>クリア！</b>${t?`<div>${t}</div>`:''}</div>`;}
function inputBind(el,sel,go){const i=el.querySelector(sel);if(!i)return;i.focus({preventScroll:true});i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};}
const NOTE_FR='分数は 3/4 のように、マイナスは -3 のように打ちこもう';

/* ===== 座標平面 ===== */
function grid(min,max,u){
  const pad=28,W=(max-min)*u+pad*2,X=v=>pad+(v-min)*u,Y=v=>pad+(max-v)*u;
  let s=`<svg class="grid" viewBox="0 0 ${W} ${W}" role="img" aria-label="座標平面">`;
  for(let i=min;i<=max;i++)s+=`<line class="gl" x1="${X(i)}" y1="${Y(min)}" x2="${X(i)}" y2="${Y(max)}"/><line class="gl" x1="${X(min)}" y1="${Y(i)}" x2="${X(max)}" y2="${Y(i)}"/>`;
  s+=`<line class="ax" x1="${X(min)}" y1="${Y(0)}" x2="${X(max)+12}" y2="${Y(0)}"/><line class="ax" x1="${X(0)}" y1="${Y(min)}" x2="${X(0)}" y2="${Y(max)-12}"/>`;
  s+=`<text class="gt it" x="${X(max)+12}" y="${Y(0)+18}">x</text><text class="gt it" x="${X(0)+8}" y="${Y(max)-6}">y</text><text class="gt" x="${X(0)-14}" y="${Y(0)+17}">O</text>`;
  const st=max>=10?5:5;[st,-st].forEach(v=>{if(v<=max&&v>=min){s+=`<text class="gt" x="${X(v)}" y="${Y(0)+17}" text-anchor="middle">${v<0?'−'+(-v):v}</text><text class="gt" x="${X(0)-8}" y="${Y(v)+5}" text-anchor="end">${v<0?'−'+(-v):v}</text>`;}});
  return{min,max,u,W,X,Y,s};
}
const latH=G=>{let s='<g class="lat">';for(let x=G.min;x<=G.max;x++)for(let y=G.min;y<=G.max;y++)s+=`<circle class="lp" cx="${G.X(x)}" cy="${G.Y(y)}" r="${G.u*.45}" data-gx="${x}" data-gy="${y}"/>`;return s+'</g>';};
const ptH=(G,x,y,lab,cls,nw,dl)=>`<g class="pt ${cls||''}" ${nw?`data-new="1" data-delay="${dl||0}"`:''}><circle cx="${G.X(x)}" cy="${G.Y(y)}" r="6"/>${lab?`<text x="${G.X(x)+8}" y="${G.Y(y)-9}">${lab}</text>`:''}</g>`;
const walkH=(G,x,y,nw)=>`<path class="walk" ${nw?'data-new="1" data-dur="650"':''} d="M${G.X(0)} ${G.Y(0)} L${G.X(x)} ${G.Y(0)} L${G.X(x)} ${G.Y(y)}"/>`;
function lineH(G,a,nw,cls='gline'){const v=fv(a);let xe=G.max;if(Math.abs(v*xe)>G.max)xe=G.max/Math.abs(v);
  const n=nw?'data-new="1" data-dur="900" data-delay="'+(nw===2?500:0)+'"':'';
  return`<path class="${cls}" ${n} d="M${G.X(0)} ${G.Y(0)} L${G.X(xe)} ${G.Y(v*xe)}"/><path class="${cls}" ${n} d="M${G.X(0)} ${G.Y(0)} L${G.X(-xe)} ${G.Y(-v*xe)}"/>`;}
function hypH(G,a,nw){const x0=Math.abs(a)/G.max,N=90;let d1='',d2='';
  for(let i=0;i<=N;i++){const x=x0*Math.pow(G.max/x0,i/N),y=a/x;d1+=(i?'L':'M')+G.X(x).toFixed(1)+' '+G.Y(y).toFixed(1);d2+=(i?'L':'M')+G.X(-x).toFixed(1)+' '+G.Y(-y).toFixed(1);}
  const n=nw?'data-new="1" data-dur="1300"':'';return`<path class="hyp" ${n} d="${d1}"/><path class="hyp" ${n} d="${d2}"/>`;}

/* ===== 1 変域（数直線と不等号） ===== */
class Ineq{
  constructor(el,d,o){this.el=el;this.d=d;this.o=o;this.ph=0;this.ends={};this.dir=null;this.ops=[];this.msg='';this.mc='';this.newShade=false;
    const two=d.lo!=null;this.two=two;const a=two?d.lo:d.v,b=two?d.hi:d.v,sp=b-a;
    this.step=sp<=10?1:sp<=24?2:sp<=60?5:10;this.from=Math.floor(a/this.step)*this.step-(two?2:5)*this.step;this.to=Math.ceil(b/this.step)*this.step+(two?2:5)*this.step;
    this.render();}
  P(v){return 30+(v-this.from)/(this.to-this.from)*540;}
  want(){const d=this.d;return this.two?{lo:d.loI?'in':'out',hi:d.hiI?'in':'out'}:{v:d.vI?'in':'out'};}
  ansOps(){const d=this.d;if(this.two)return[d.loI?'≦':'<',d.hiI?'≦':'<'];return[d.dir==='R'?(d.vI?'≧':'>'):(d.vI?'≦':'<')];}
  lineSVG(){
    let s=`<svg class="nline" viewBox="0 0 600 96" role="img" aria-label="数直線"><line class="nl" x1="20" y1="50" x2="584" y2="50"/><path class="nl" d="M584 50 l-10 -6 v12 z" style="fill:var(--ink)"/>`;
    const many=(this.to-this.from)/this.step>14;let k=0;
    for(let v=this.from;v<=this.to;v+=this.step){const x=this.P(v);s+=`<line class="tk" x1="${x}" y1="43" x2="${x}" y2="57"/>`;
      if(!many||k%2===0||v===0)s+=`<text class="tl" x="${x}" y="80" text-anchor="middle">${v<0?'−'+(-v):v}</text>`;k++;}
    if(this.ph>=1){const nw=this.newShade?'data-new="1" data-dur="700"':'';
      if(this.two)s+=`<path class="shade" ${nw} d="M${this.P(this.d.lo)} 50 L${this.P(this.d.hi)} 50"/>`;
      else{const e=this.d.dir==='R'?586:14;s+=`<path class="shade" ${nw} d="M${this.P(this.d.v)} 50 L${e} 50"/>`;}}
    const ends=this.two?[['lo',this.d.lo],['hi',this.d.hi]]:[['v',this.d.v]];
    ends.forEach(([k,v])=>{const st=this.ends[k];s+=`<g class="mk ${st||'unset'}" data-end="${k}" tabindex="0"><circle cx="${this.P(v)}" cy="50" r="10"/><text class="tl b" x="${this.P(v)}" y="28" text-anchor="middle">${v<0?'−'+(-v):v}</text></g>`;});
    return s+'</svg>';
  }
  render(){
    let h=`<p class="big">${IX} が <b>${this.d.t}</b></p>${this.lineSVG()}`;
    if(this.ph===0){
      h+=`<p class="muted" style="margin:0">はしの点をタップして <b>●</b>（その数をふくむ）か <b>○</b>（ふくまない）にしよう。</p>`;
      if(!this.two)h+=`<div class="opts"><button class="opt txt ${this.dir==='L'?'on':''}" data-dir="L">← 左側（小さい方）</button><button class="opt txt ${this.dir==='R'?'on':''}" data-dir="R">右側（大きい方）→</button></div>`;
      h+=`<p><button class="btn" data-a="chk">数直線をチェック</button></p>`;
    }else if(this.ph===1){
      const sl=i=>`<button class="ops ${this.ops[i]?'f':''}" data-sl="${i}">${this.ops[i]||'？'}</button>`;
      h+=`<p class="muted" style="margin:6px 0 0">不等号をえらんで、式にしよう。</p><div class="ineq">${this.two?`<span>${fH(F(this.d.lo))}</span>${sl(0)}${IX}${sl(1)}<span>${fH(F(this.d.hi))}</span>`:`${IX}${sl(0)}<span>${fH(F(this.d.v))}</span>`}</div>
        <div class="pool">${['≦','<','≧','>'].map(o=>`<button class="pc" data-op="${o}">${o}</button>`).join('')}</div>`;
    }else h+=clearHTML(`<span class="eqt">${this.two?fH(F(this.d.lo))+' '+this.ops[0]+' '+IX+' '+this.ops[1]+' '+fH(F(this.d.hi)):IX+' '+this.ops[0]+' '+fH(F(this.d.v))}</span>`);
    h+=`<div class="fb ${this.mc}" aria-live="polite">${this.msg}</div>`;
    this.el.innerHTML=h;this.newShade=false;animNew(this.el);this.bind();
    if(this.pend){const p=this.pend;this.pend=null;if(p.shake)shake(this.el.querySelector(p.shake));if(p.conf)confetti();}
  }
  bind(){
    this.el.querySelectorAll('[data-end]').forEach(g=>{const f=()=>{if(this.ph)return;const k=g.dataset.end;this.ends[k]=this.ends[k]==='in'?'out':'in';fx.stamp();this.render();
      const c=this.el.querySelector(`[data-end="${k}"] circle`);if(c&&!RM){c.style.transformBox='fill-box';c.style.transformOrigin='center';c.animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'});}};
      g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')f();};});
    this.el.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{this.dir=b.dataset.dir;fx.ok();this.render();});
    const c=this.el.querySelector('[data-a="chk"]');if(c)c.onclick=()=>this.check();
    this.el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>this.pickOp(b));
    this.el.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{this.ops[+b.dataset.sl]=null;this.render();});
  }
  check(){
    const w=this.want(),keys=Object.keys(w);
    if(keys.some(k=>!this.ends[k])){this.msg='はしの点をタップして ● か ○ を決めよう。';this.mc='ng';fx.ng();this.pend={shake:'.nline'};this.render();return;}
    if(!this.two&&!this.dir){this.msg='左側か右側か、えらぼう。';this.mc='ng';fx.ng();this.render();return;}
    if(keys.some(k=>this.ends[k]!==w[k])){this.msg='「以上」「以下」は ●（その数もふくむ）。「未満」「より大きい」「より小さい」は ○（ふくまない）。';this.mc='ng';
      this.o.onMiss&&this.o.onMiss('変域');fx.ng();this.pend={shake:'.nline'};this.render();return;}
    if(!this.two&&this.dir!==this.d.dir){this.msg='「より大きい」「以上」は右側、「より小さい」「未満」「以下」は左側。';this.mc='ng';this.o.onMiss&&this.o.onMiss('変域');fx.ng();this.pend={shake:'.nline'};this.render();return;}
    this.ph=1;this.newShade=true;this.msg='数直線OK！';this.mc='ok';fx.clear();this.render();
  }
  async pickOp(b){
    const i=this.two?(this.ops[0]?1:0):0;if(this.ops[i]&&(!this.two||this.ops[1]))return;
    const tg=this.el.querySelector(`[data-sl="${i}"]`);await shot(b.getBoundingClientRect(),tg.getBoundingClientRect(),b.dataset.op,'fxtok',260);
    this.ops[i]=b.dataset.op;fx.ok();
    const need=this.two?2:1;if(this.ops.filter(Boolean).length<need){this.render();return;}
    const ans=this.ansOps();
    if(ans.every((a,k)=>a===this.ops[k])){this.ph=2;fx.win();this.msg='';this.pend={conf:1};this.render();this.o.onClear&&setTimeout(()=>this.o.onClear(),1100);}
    else{this.ops=[];this.msg='●（ふくむ）は ≦ や ≧、○（ふくまない）は < や >。数直線とくらべよう。';this.mc='ng';fx.ng();this.o.onMiss&&this.o.onMiss('変域');this.pend={shake:'.ineq'};this.render();}
  }
}

/* ===== 2 関数マシン ===== */
class Func{
  constructor(el,d,o){this.el=el;this.d=d;this.o=o;this.k=0;this.log=[];this.msg='';this.mc='';this.done=false;this.render();}
  render(){

      <div class="mach"><div class="mio">${IX}<small>入れる</small></div><div class="mbody"><svg viewBox="0 0 60 60" class="gear" aria-hidden="true"><path d="M30 6l5 8 9-3 1 9 9 3-4 8 6 7-8 5 1 9-9-1-4 8-7-6-7 6-4-8-9 1 1-9-8-5 6-7-4-8 9-3 1-9 9 3z"/><circle cx="30" cy="30" r="8" style="fill:var(--card)"/></svg><b>関数マシン</b></div><div class="mio out">${IY}<small>出てくる</small></div></div>
      <div class="mlog">${this.log.map(r=>`<div class="lg ${r.many?'many':''}">${IX}=${r.x} → ${IY}=${r.ys.join('、')}${r.many?'　<b>1つに決まらない！</b>':''}</div>`).join('')}</div>`;

      h+=`<div class="opts"><button class="opt txt" data-f="1">${IY} は ${IX} の関数である</button><button class="opt txt" data-f="0">関数ではない</button></div>`;}
    h+=`<div class="fb ${this.mc}" aria-live="polite">${this.msg}</div>`;
    this.el.innerHTML=h;
    if(!RM)this.el.querySelectorAll('.lg.newrow').forEach(e=>e.animate([{opacity:0,transform:'translateX(-12px)'},{opacity:1,transform:'none'}],{duration:300}));

  async run(btn){

    const body=this.el.querySelector('.mbody'),out=this.el.querySelector('.mio.out'),gear=this.el.querySelector('.gear');
    await shot(btn.getBoundingClientRect(),body.getBoundingClientRect(),`${IX}=${x}`,'fxtok chipfly',420);
    tone([[200,.4,'sawtooth',120]]);
    if(!RM){gear.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:700,easing:'ease-in-out'});await body.animate([{transform:'none'},{transform:'translateY(-4px) rotate(-2deg)'},{transform:'translateY(2px) rotate(2deg)'},{transform:'none'}],{duration:350,iterations:2}).finished;}
    const br=body.getBoundingClientRect(),or=out.getBoundingClientRect();
    for(let i=0;i<ys.length;i++){const to={left:or.left,top:or.top+i*22-(ys.length-1)*11,width:or.width,height:or.height};
      shot(br,to,`${IY}=${ys[i]}`,'fxtok chipfly',380);fx.ok();await wait(RM?0:200);}
    await wait(RM?0:350);

    const last=this.el.querySelector('.mlog .lg:last-child');if(last&&!RM)last.animate([{opacity:0,transform:'translateX(-14px)'},{opacity:1,transform:'none'}],{duration:320});
  }
  pick(b){

/* ===== 3 式を求める（比例・反比例） ===== */
class Find{
  constructor(el,d,o){this.el=el;this.d=d;this.o=o;this.ph=0;this.sl=[null,null];this.sel=null;this.msg='';this.mc='';this.hint=false;

  tokH(k){const v=k==='x'?this.x:this.y;return`${k==='x'?IX:IY} = ${fH(v)}`;}
  render(){
    const d=this.d,hi=d.k==='hi';
    let h=`<p class="big">${IY} は ${IX} に<b>${hi?'比例':'反比例'}</b>し、${IX} = ${fH(this.x)} のとき ${IY} = ${fH(this.y)}</p>`;
    const slot=i=>{const v=this.sl[i];return`<button class="ops wide ${v?'f':''}" data-s="${i}">${v?fHp(v==='x'?this.x:this.y):'？'}</button>`;};
    h+=`<div class="tmpl">${hi?`${slot(0)} = <i>a</i> × ${slot(1)}`:`<i>a</i> = ${slot(0)} × ${slot(1)}`}</div>`;
    if(this.ph===0){
      h+=`<p class="muted" style="margin:0">${hi?`${IY} = <i>a</i>${IX} に代入。数をえらんで、□をタップ。`:`反比例は <i>a</i> = ${IX}${IY}。数をえらんで、□をタップ。`}</p>
        <div class="pool">${['x','y'].map(k=>`<button class="pc ${this.sel===k?'sel':''} ${this.sl.includes(k)?'used':''}" data-t="${k}" ${this.sl.includes(k)?'disabled':''}>${this.tokH(k)}</button>`).join('')}</div>`;
    }else if(this.ph===1){
      h+=`<div class="inrow"><span class="eqt"><i>a</i> = </span><input id="ai" autocomplete="off" aria-label="比例定数"><button class="btn" data-a="ago">決定</button><button class="tool undo" data-a="hint">ヒント</button></div>`;
      if(this.hint)h+=`<span class="hintline">${hi?`<i>a</i> = ${fH(this.y)} ÷ ${fHp(this.x)}`:`<i>a</i> = ${fH(this.x)} × ${fHp(this.y)}`}。わり切れなければ分数</span>`;
      h+=`<p class="muted" style="font-size:14px">${NOTE_FR}</p>`;
    }
    if(this.ph>=2){h+=`<div class="eqbig" data-eq>${hi?eqHi(this.a):eqHan(this.a)}</div>`;}
    if(this.ph===2&&d.ask){const q=d.ask;h+=`<div class="inrow"><span>${q.x!=null?`${IX} = ${fH(PF(q.x))} のとき ${IY} = `:`${IY} = ${fH(PF(q.y))} のとき ${IX} = `}</span><input id="qi" autocomplete="off" aria-label="答え"><button class="btn" data-a="qgo">決定</button></div>`;}
    if(this.ph===3)h+=clearHTML(d.ask?'式を求めて、値まで出せた。':'式が求められた。');
    h+=`<div class="fb ${this.mc}" aria-live="polite">${this.msg}</div>`;
    this.el.innerHTML=h;this.bind();
    if(this.pend){const p=this.pend;this.pend=null;if(p.shake)shake(this.el.querySelector(p.shake));if(p.eq&&!RM){const e=this.el.querySelector('[data-eq]');
      e.animate([{transform:'scale(2.2) rotate(-6deg)',opacity:0},{transform:'scale(1) rotate(-2deg)',opacity:1,offset:.6},{transform:'none'}],{duration:520,easing:'ease-in'});setTimeout(()=>{fx.stamp();const c=ctr(e.getBoundingClientRect());burst(c.x,c.y,cv('--ok'),12,70);},300);}
      if(p.conf)confetti();}
  }
  bind(){
    const q=s=>this.el.querySelectorAll(s);
    q('[data-t]').forEach(b=>b.onclick=()=>{this.sel=b.dataset.t;fx.ok();this.render();});
    q('[data-s]').forEach(b=>b.onclick=()=>this.place(+b.dataset.s,b));
    const a=this.el.querySelector('[data-a="ago"]');if(a){a.onclick=()=>this.goA();inputBind(this.el,'#ai',()=>this.goA());}
    const hb=this.el.querySelector('[data-a="hint"]');if(hb)hb.onclick=()=>{this.hint=true;this.render();};

  async place(i,slotBtn){

    const hi=this.d.k==='hi',ok=!hi||(i===0?this.sel==='y':this.sel==='x');

    const tb=this.el.querySelector(`[data-t="${this.sel}"]`);await shot(tb.getBoundingClientRect(),slotBtn.getBoundingClientRect(),this.tokH(this.sel),'fxtok chipfly',360);
    this.sl[i]=this.sel;this.sel=null;fx.ok();this.msg='';
    if(this.sl[0]&&this.sl[1]){this.ph=1;this.msg='代入できた！ <i>a</i> を計算しよう。';this.mc='ok';}
    this.render();
  }
  goA(){
    const r=judge(this.el.querySelector('#ai').value,fS(this.a));
    if(!r.ok){this.msg=r.msg.startsWith('ちがう')?(this.d.k==='hi'?'ちがうよ。<i>a</i> = '+IY+' ÷ '+IX+'。符号にも気をつけよう。':'ちがうよ。<i>a</i> = '+IX+' × '+IY+'。符号にも気をつけよう。'):r.msg;this.mc='ng';fx.ng();
      this.o.onMiss&&this.o.onMiss(this.d.k==='hi'?'比例の式':'反比例の式');this.pend={shake:'.inrow'};this.render();return;}
    this.ph=2;this.msg='';this.pend={eq:1};
    if(!this.d.ask){this.ph=3;this.pend.conf=1;fx.win();this.render();this.o.onClear&&setTimeout(()=>this.o.onClear(),1300);return;}
    this.render();
  }
  goQ(){
    const q=this.d.ask,hi=this.d.k==='hi';let ans;
    if(q.x!=null){const x=PF(q.x);ans=hi?fmul(this.a,x):fdiv(this.a,x);}else{const y=PF(q.y);ans=hi?fdiv(y,this.a):fdiv(this.a,y);}
    const r=judge(this.el.querySelector('#qi').value,fS(ans));
    if(!r.ok){this.msg=r.msg.startsWith('ちがう')?'ちがうよ。式に代入して計算しよう。':r.msg;this.mc='ng';fx.ng();this.o.onMiss&&this.o.onMiss('値を求める');this.pend={shake:'.inrow'};this.render();return;}
    this.ph=3;this.msg='';fx.win();this.pend={conf:1};this.render();this.o.onClear&&setTimeout(()=>this.o.onClear(),1300);
  }
}

/* ===== 4 座標：点をとる・読む ===== */
class Plot{

const R_=(x,y,w,h,c='bx')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${c}" rx="3"/>`;
const T_=(x,y,s,c='')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="middle">${s}</text>`;
const L_=(a,b,c,d,cl='ln2')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="${cl}"/>`;
const plain=s=>s.replace(/-/g,'−').replace(/\//g,'÷');

class Word{
  constructor(el,w,o={}){this.el=el;this.w=w;this.o=o;this.ph=0;this.pend={};this.busy=false;this.drawn=false;this.filled={};this.selChip=null;this.selSlot=null;this.box=[];this.msg='';this.render();}
  render(){
    const w=this.w;const names=['図をうめる','式をつくる','解く','答える'];
    let h=`<div class="wsteps">${names.map((n,i)=>`<span class="${i===this.ph?'on':i<this.ph?'ok':''}">${i+1} ${n}</span>`).join('')}</div>`;
    h+=`<p class="story">${w.story}</p>`;
    // 図
    let svg=w.svg;w.slots.forEach((s,i)=>{const f=this.filled[i];
      svg+=`<g class="slot ${f?'filled':''} ${this.selSlot===i?'sel':''}" data-slot="${i}"><rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="4"/>${T_(s.x+s.w/2,s.y+s.h/2+5,f?plain(s.a):'？')}</g>`;});
    h+=`<svg class="dg" viewBox="0 0 600 ${w.h}" role="img" aria-label="${w.title}の図">${svg}</svg>`;
    if(this.ph===0){
      h+=`<p class="muted" style="margin:0">式のカードを選んで、図の「？」をタップしてうめよう。</p><div class="pool">${w.chips.map((c,i)=>{const used=Object.values(this.filled).includes(c)&&w.slots.filter(s=>s.a===c).length<=Object.values(this.filled).filter(v=>v===c).length;
        return`<button class="pc ${this.selChip===i?'sel':''} ${used?'used':''}" data-c="${i}" ${used?'disabled':''}>${exprH(c)}</button>`;}).join('')}</div>`;
    }else if(this.ph===1){
      const e=w.eqs;
      h+=`<p class="muted" style="margin:0">${e.prop?'図から比例式をつくろう。カードを1つ選ぶ。':'同じものを2通りで表したのはどれとどれ？ カードを2つ選んで「＝」でつなごう。'}</p>`;
      if(e.prop)h+=`<div class="builder"><div class="box ${this.box[0]!=null?'f':''}" data-b="0">${this.box[0]!=null?exprH(e.chips[this.box[0]]):'？'}</div></div>`;
      else h+=`<div class="builder"><div class="box ${this.box[0]!=null?'f':''}" data-b="0">${this.box[0]!=null?exprH(e.chips[this.box[0]]):'？'}</div><span class="beq">＝</span><div class="box ${this.box[1]!=null?'f':''}" data-b="1">${this.box[1]!=null?exprH(e.chips[this.box[1]]):'？'}</div></div>`;
      h+=`<div class="pool">${e.chips.map((c,i)=>`<button class="pc ${this.box.includes(i)?'used':''}" data-e="${i}" ${this.box.includes(i)?'disabled':''}>${exprH(c)}</button>`).join('')}</div>`;
      if(e.tip)h+=`<p class="muted" style="font-size:15px">${md(e.tip)}</p>`;
    }else if(this.ph===2){
      h+=`<div id="weng"></div>`;
    }else if(this.ph===3){
      h+=`<div class="panel"><div>${w.ansQ}</div><div class="opts">${shuffle(w.ansOpts.map((o,i)=>[o,i])).map(([o,i])=>`<button class="opt txt" data-ans="${i}">${md(o)}</button>`).join('')}</div></div>`;
    }else{
      h+=`<div class="clearbox pop"><b>クリア！</b><div>${md(w.why)}</div></div>`;
    }
    h+=`<div class="fb ${this.msgCls||''}" aria-live="polite">${this.msg}</div>`;
    this.el.innerHTML=h;this.bind();this.afterR();
    if(this.ph===2){new Engine(this.el.querySelector('#weng'),w.eq,{onMiss:this.o.onMiss,doneText:'方程式が解けた。でも、まだ終わりじゃない。',onClear:()=>{this.ph=3;this.msg='';this.render();}});}
  }
  afterR(){
    const p=this.pend;this.pend={};
    if(p.shake)shake(this.el.querySelector(p.shake));
    if(p.confetti)confetti();
    if(RM)return;
    const svg=this.el.querySelector('svg.dg');if(svg&&!this.drawn){this.drawn=true;drawIn(svg);}
    if(p.filled!=null){const g=this.el.querySelector(`[data-slot="${p.filled}"]`);if(g){g.style.transformBox='fill-box';g.style.transformOrigin='center';
      g.animate([{transform:'scale(1.45)'},{transform:'scale(1)'}],{duration:450,easing:'cubic-bezier(.34,1.56,.64,1)'});}}
    if(p.boxEnter!=null){const b=this.el.querySelector(`[data-b="${p.boxEnter}"]`);b&&b.animate([{transform:'scale(.6)',opacity:.3},{transform:'none',opacity:1}],{duration:300,easing:'cubic-bezier(.34,1.56,.64,1)'});}
    if(p.slam){const b0=this.el.querySelector('[data-b="0"]'),b1=this.el.querySelector('[data-b="1"]'),eq=this.el.querySelector('.beq');
      b0&&b0.animate([{transform:'none'},{transform:'translateX(16px)'},{transform:'none'}],{duration:380});
      b1&&b1.animate([{transform:'none'},{transform:'translateX(-16px)'},{transform:'none'}],{duration:380});

      const bl=this.el.querySelector('.builder');if(bl){const c=ctr(bl.getBoundingClientRect());burst(c.x,c.y,cv('--ok'),14,70);}}
    if(p.enter){const t=this.el.querySelector(p.enter);t&&t.animate([{transform:'translateY(16px)',opacity:0},{transform:'none',opacity:1}],{duration:400,easing:'ease-out'});}
  }
  bind(){

    q('[data-slot]').forEach(g=>g.onclick=()=>{const i=+g.dataset.slot;if(this.filled[i])return;this.selSlot=i;this.tryFill();});
    q('[data-e]').forEach(b=>b.onclick=()=>{const i=+b.dataset.e;const n=this.w.eqs.prop?1:2;const k=[...Array(n).keys()].find(j=>this.box[j]==null);
      if(k==null)return;this.box[k]=i;fx.ok();this.pend.boxEnter=k;if([...Array(n).keys()].every(j=>this.box[j]!=null))this.checkEq();else this.render();});
    q('[data-b]').forEach(b=>b.onclick=()=>{this.box[+b.dataset.b]=null;this.render();});
    q('[data-ans]').forEach(b=>b.onclick=()=>{if(b.dataset.ans==='0'){this.ph=4;fx.win();this.msg='';this.pend.confetti=true;this.render();this.o.onClear&&this.o.onClear();}
      else{fx.ng();shake(b);b.disabled=true;this.o.onMiss&&this.o.onMiss('解き切る');S.miss['解き切る']=(S.miss['解き切る']||0)+1;save();
        const fb=this.el.querySelector('.fb');fb.className='fb ng';fb.innerHTML=md(this.w.why);}});
  }
  async tryFill(){
    if(this.busy)return;
    if(this.selChip==null){this.render();return;}
    if(this.selSlot==null){this.render();return;}
    const s=this.w.slots[this.selSlot],c=this.w.chips[this.selChip],si=this.selSlot,ci=this.selChip;
    if(c===s.a){
      const ce=this.el.querySelector(`.pc[data-c="${ci}"]`),se=this.el.querySelector(`[data-slot="${si}"]`);
      if(ce&&se){this.busy=true;await shot(ce.getBoundingClientRect(),se.getBoundingClientRect(),ce.innerHTML,'fxtok chipfly',380);this.busy=false;
        const cc=ctr(se.getBoundingClientRect());burst(cc.x,cc.y,cv('--ok'),10,40);}
      this.filled[si]=c;fx.ok();this.msg='';this.pend.filled=si;
      if(this.w.slots.every((_,i)=>this.filled[i])){this.msg='図ができた！';this.msgCls='ok';fx.clear();
        setTimeout(()=>{this.ph=1;this.msg='';this.pend.enter='.builder';this.render();},900);}}
    else{fx.ng();this.msg=s.tip?md(s.tip):'そこには入らない。図の位置と問題文をくらべよう。';this.msgCls='ng';this.o.onMiss&&this.o.onMiss();this.pend.shake=`[data-slot="${si}"]`;}
    this.selChip=null;this.selSlot=null;this.render();
  }
  checkEq(){
    const e=this.w.eqs;let ok;
    if(e.prop)ok=e.chips[this.box[0]]===e.ans[0];
    else{const a=[e.chips[this.box[0]],e.chips[this.box[1]]];ok=(a[0]===e.ans[0]&&a[1]===e.ans[1])||(a[0]===e.ans[1]&&a[1]===e.ans[0]);}

  }
}

function homeAnim(nc,ni){
  const pct=nc/STAGES.length*100,bar=app.querySelector('.bar>span');
  if(!RM&&bar&&S.pct!=null&&S.pct!==pct)bar.animate([{width:S.pct+'%'},{width:pct+'%'}],{duration:900,delay:300,easing:'ease-out',fill:'backwards'});
  S.pct=pct;S.shown=S.shown||{};
  const dots=app.querySelectorAll('.map .dot');let k=0;
  STAGES.forEach((s,i)=>{if(cleared(s)&&!S.shown[s.id]){S.shown[s.id]=1;const d=dots[i];
    if(!RM&&d){const dl=300+k*180;d.animate([{transform:'scale(2.4) rotate(-30deg)',opacity:0},{transform:'scale(1) rotate(0)',opacity:1}],{duration:420,delay:dl,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'backwards'});setTimeout(()=>fx.stamp(),dl+250);k++;}}});
  const map=app.querySelector('.map'),lis=map.querySelectorAll('li');
  const tk=document.createElement('div');tk.className='runner';tk.innerHTML=RUNNER;map.appendChild(tk);
  const target=nc===STAGES.length?lis.length-1:ni,yOf=i=>lis[i].offsetTop+(lis[i].offsetHeight-46)/2;
  tk.style.top=yOf(target)+'px';
  if(!RM&&S.pos!=null&&S.pos!==target&&lis[S.pos]){
    const n=Math.abs(target-S.pos),fr=[],base=yOf(target);
    for(let j=0;j<=n;j++){const y=yOf(S.pos+(target>S.pos?j:-j))-base;fr.push({transform:`translateY(${y}px)`,offset:j/n});
      if(j<n){const y2=(y+yOf(S.pos+(target>S.pos?j+1:-(j+1)))-base)/2-24;fr.push({transform:`translateY(${y2}px) scaleY(1.1)`,offset:(j+.5)/n});}}
    const dl=600+k*180;tk.animate(fr,{duration:n*420,delay:dl,easing:'ease-in-out',fill:'backwards'});
    for(let j=0;j<n;j++)setTimeout(()=>tone([[520+j*80,.08,'sine',780+j*80]]),dl+j*420+150);
  }
  S.pos=target;
}

function startPlay(st,list,r){
  const el=document.getElementById('play'),it=list[view.p];const tok=view,pp=view.p;let missed=0;const mt=[];
  const onMiss=(t)=>{missed++;if(t)mt.push(t);if(!st.boss||view!==tok||view.p!==pp)return;view.hearts=(view.hearts??3)-1;
    const hs=app.querySelector('.hearts');if(hs){hs.textContent='♥'.repeat(Math.max(0,view.hearts))+'♡'.repeat(3-Math.max(0,view.hearts));shake(hs);
      const rr=hs.getBoundingClientRect();floatText(rr.left+60,rr.top,'−♥');
      if(!RM)fxl.animate([{boxShadow:'inset 0 0 0 0 transparent'},{boxShadow:`inset 0 0 60px 10px ${cv('--red')}`},{boxShadow:'inset 0 0 0 0 transparent'}],{duration:500});}
    if(view.hearts<=0){view.hearts=3;setTimeout(()=>{alertBox('ライフがなくなった！ この問題を最初からもう一度。');render();},500);}};
  const onClear=()=>{r.done[pp]=true;save();
    logResult(`${st.id}-${pp}`,CUR.unit,it.sk,qText(it),missed?'×':'○',`ステージ ${st.name}`+(mt.length?`（ミス：${[...new Set(mt)].join('・')}）`:''));
    if(view!==tok||view.p!==pp||view.step!==1)return;
    if(missed&&!st.boss){const c=ctr(el.getBoundingClientRect());floatText(c.x,c.y,'苦手ブロックに追加',cv('--gold'));}
    const nx=list.findIndex((_,j)=>!r.done[j]);
    if(st.boss){fx.hit();const b=app.querySelector('.bosshead svg');
      if(b){const c=ctr(b.getBoundingClientRect());shake(b);if(!RM)b.animate([{filter:'brightness(2.5)'},{filter:'none'}],{duration:350});
        floatText(c.x,c.y-30,'−1');burst(c.x,c.y,cv('--red'),16,70);
        const seg=app.querySelectorAll('.hpbar span')[pp];if(seg&&!RM)seg.animate([{transform:'scaleX(1)',opacity:1},{transform:'scaleX(0)',opacity:.15}],{duration:500,delay:200,fill:'forwards'});
        if(nx<0)setTimeout(()=>{explode(b);fx.hit();},500);}}
    setTimeout(()=>{if(view!==tok||view.p!==pp||view.step!==1)return;if(nx<0){fx.win();view.step=2;render();window.scrollTo({top:0});}
      else{view.p=nx;render();}},st.boss?(nx<0?1600:1000):1900);};
  el.innerHTML=`<p class="muted" style="margin:0">${view.p+1} / ${list.length}　${it.title}</p><div id="pl"></div>`;
  window.__act=new ACT[it.t](el.querySelector('#pl'),it.d,{onMiss,onClear});
}

/* ===== 苦手トレーニング ===== */
function drill(){
  const sk=view.sk,info=SK[sk];useCh(info.c);
  const l=weakList().filter(o=>o.sk===sk);
  let h=`<button class="back" id="back">← もどる</button><h2>苦手をつぶす：${info.label}</h2><p class="muted" style="margin:0">${CH[info.c].name}　毎回ちがう数の問題。1回でまちがえずに解けると、ブロックが1つ直る。</p>`;
  h+=`<div class="wall">${l.length?l.map(o=>`<div class="wb ${o.id===view.tid?'tg':''}">${BLOCK(o,true)}<div class="need">${'<i class="nd"></i>'.repeat(Math.max(0,o.need))}</div></div>`).join(''):''}${(view.grads||[]).map(id=>`<div class="wb grad"><svg class="blk big" viewBox="0 0 60 60"><rect x="3" y="3" width="54" height="54" rx="6" class="gold"/><text x="30" y="37" text-anchor="middle" class="gtx">卒業</text></svg></div>`).join('')}</div>`;
  if(!l.length){h+=`<div class="clearbox pop"><b>この苦手は全部卒業！</b><div>スプレッドシートにも ○ が記録された。</div><p><button class="btn" id="home2">もどる</button></p></div>`;app.innerHTML=topbar()+h;bindTop();
    document.getElementById('back').onclick=document.getElementById('home2').onclick=()=>{view={name:'home',c:info.c};render();};return;}
  if(view.intro)h+=`<details class="card" open id="pt"><summary><b>まず確認：いい例・悪い例</b></summary>${pointHTML(P[info.p])}<button class="btn" id="go">わかった → 問題へ</button></details>`;
  else h+=`<div class="card" id="play"></div>`;
  app.innerHTML=topbar()+h;bindTop();
  document.getElementById('back').onclick=()=>{view={name:'home',c:info.c};render();};
  bindQuiz(P[info.p]);
  if(!RM)app.querySelectorAll('.wall .wb').forEach((b,i)=>b.animate([{transform:'scale(.3)',opacity:0},{transform:'none',opacity:1}],{duration:380,delay:i*70,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'backwards'}));
  const g=document.getElementById('go');if(g)g.onclick=()=>{view.intro=false;fx.ok();render();};
  if(view.intro)return;
  const target=l.find(o=>o.id===view.tid)||l[0];view.tid=target.id;
  app.querySelectorAll('.wb').forEach(w=>w.classList.toggle('tg',!!w.querySelector(`[data-bid="${target.id}"]`)));
  const it=view.cur||(view.cur=genItem(sk));const tok=view.cur;let missed=0;const mt=[];
  const el=document.getElementById('play');
  el.innerHTML=`<p class="muted" style="margin:0">ねらうブロック：<b style="color:var(--red)">ひびの入ったブロック</b>（あと ${target.need} 回正解で卒業）</p><div id="pl"></div>`;
  window.__act=new ACT[it.t](el.querySelector('#pl'),it.d,{onMiss:t=>{missed++;if(t)mt.push(t);},onClear:()=>{
    if(view.cur!==tok)return;const res=missed?'×':'○';
    logResult(target.id,CH[info.c].unit,sk,qText(it),res,'苦手トレーニング'+(mt.length?`（ミス：${[...new Set(mt)].join('・')}）`:''));
    const be=app.querySelector(`.wb [data-bid="${target.id}"]`),after=weakList().find(o=>o.id===target.id);
    if(be){const c=ctr(be.getBoundingClientRect());
      if(res==='○'){burst(c.x,c.y,cv('--ok'),14,60);fx.stamp();const cr=be.querySelectorAll('.crack');const last=cr[cr.length-1];
        if(last&&!RM)last.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});be.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:400});
        if(!after){floatText(c.x,c.y-30,'卒業！',cv('--gold'));setTimeout(()=>{fx.win();banner('苦手卒業！',cv('--gold'));confetti(70);},350);(view.grads=view.grads||[]).push(target.id);}
        else floatText(c.x,c.y-30,'あと'+after.need+'回',cv('--ok'));}
      else{shake(be);floatText(c.x,c.y-30,'ひびが入った',cv('--red'));fx.hit();}}
    setTimeout(()=>{if(view.cur!==tok)return;view.cur=null;if(!after)view.tid=null;render();window.scrollTo({top:0,behavior:RM?'auto':'smooth'});},res==='○'&&!after?2000:1500);
  }});
}

function alertBox(t){const d=document.createElement('div');d.className='clearbox';d.style.cssText='position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--card);z-index:20;max-width:90%';d.innerHTML=`<b style="color:var(--red)">${t}</b>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}

function render(){if(view.name==='home')home();else if(view.name==='drill')drill();else stage();}
render();
mlFlush();mlSnapshot(false);mlWeakFetch().then(w=>{if(w&&view.name==='home'&&!(document.activeElement&&document.activeElement.matches('input')))render();});

</script>
</body>
